<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 830" font-family="Signika Negative, Helvetica, Arial, sans-serif" fill="#222">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2690e7"/></marker>
</defs>
<!-- progressive disclosure bands -->
<rect x="20" y="112" width="1680" height="112" fill="#2690e7" fill-opacity="0.07"/>
<rect x="20" y="356" width="1680" height="90" fill="#3a9a5b" fill-opacity="0.10"/>
<rect x="20" y="460" width="1680" height="210" fill="#d64545" fill-opacity="0.07"/>
<g font-size="20" font-weight="600" text-anchor="end">
<text x="1690" y="140" fill="#2690e7">level 1: metadata</text>
<text x="1690" y="384" fill="#3a9a5b">level 2: instructions</text>
<text x="1690" y="488" fill="#d64545">level 3: resources</text>
</g>
<!-- lifelines -->
<g font-size="26" font-weight="600" text-anchor="middle">
<rect x="60" y="20" width="180" height="60" rx="10" fill="#fff" stroke="#555" stroke-width="3"/><text x="150" y="59">User</text>
<rect x="420" y="20" width="220" height="60" rx="10" fill="#fff" stroke="#555" stroke-width="3"/><text x="530" y="59">Controller</text>
<rect x="830" y="20" width="160" height="60" rx="10" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/><text x="910" y="59">LLM</text>
<rect x="1310" y="20" width="200" height="60" rx="10" fill="#3a9a5b" fill-opacity="0.15" stroke="#3a9a5b" stroke-width="3"/><text x="1410" y="59">Skill folders</text>
</g>
<g stroke="#999" stroke-width="2" stroke-dasharray="6 6">
<line x1="150" y1="80" x2="150" y2="810"/><line x1="530" y1="80" x2="530" y2="810"/>
<line x1="910" y1="80" x2="910" y2="810"/><line x1="1410" y1="80" x2="1410" y2="810"/>
</g>
<!-- messages -->
<g stroke="#555" stroke-width="3" fill="none">
<line x1="530" y1="160" x2="1404" y2="160" marker-end="url(#a)"/>
<line x1="1410" y1="205" x2="536" y2="205" stroke-dasharray="10 6" marker-end="url(#a)"/>
<line x1="530" y1="260" x2="904" y2="260" marker-end="url(#a)"/>
<line x1="150" y1="320" x2="524" y2="320" marker-end="url(#a)"/>
<line x1="530" y1="345" x2="904" y2="345" marker-end="url(#a)"/>
<line x1="910" y1="395" x2="1404" y2="395" stroke="#2690e7" marker-end="url(#b)"/>
<line x1="1410" y1="435" x2="916" y2="435" stroke-dasharray="10 6" marker-end="url(#a)"/>
<line x1="910" y1="500" x2="1404" y2="500" stroke="#2690e7" marker-end="url(#b)"/>
<line x1="1410" y1="540" x2="916" y2="540" stroke-dasharray="10 6" marker-end="url(#a)"/>
<line x1="910" y1="610" x2="1404" y2="610" stroke="#2690e7" marker-end="url(#b)"/>
<line x1="1410" y1="650" x2="916" y2="650" stroke-dasharray="10 6" marker-end="url(#a)"/>
<line x1="910" y1="720" x2="536" y2="720" stroke-dasharray="10 6" marker-end="url(#a)"/>
<line x1="530" y1="780" x2="156" y2="780" stroke-dasharray="10 6" marker-end="url(#a)"/>
</g>
<g font-size="20">
<text x="545" y="150">at startup: discover, i.e. parse the front matter of every SKILL.md</text>
<text x="545" y="197" fill="#555">name + description of each skill</text>
<text x="545" y="250">system prompt, with the catalogue of skills</text>
<text x="165" y="310" font-style="italic">"Review Mario Rossi's application"</text>
<text x="545" y="337">the request</text>
<text x="925" y="385" fill="#2690e7" font-family="monospace" font-size="18">load_skill("phd-application-review")</text>
<text x="935" y="427" fill="#555">SKILL.md body: the procedure</text>
<text x="925" y="490" fill="#2690e7" font-family="monospace" font-size="18">run_skill_script("check_application.py", …)</text>
<text x="935" y="532" fill="#555">JSON output: documents, letter</text>
<text x="925" y="600" fill="#2690e7" font-family="monospace" font-size="18">read_skill_file("references/rubric.md")</text>
<text x="935" y="642" fill="#555">the committee's rubric</text>
<text x="545" y="710" fill="#555">the report, following assets/report-template.md</text>
<text x="165" y="770" fill="#555">the report</text>
</g>
<text x="1160" y="805" font-size="18" font-style="italic" fill="#2690e7" text-anchor="middle">blue arrows: tool calls, which the controller executes</text>
</svg>
