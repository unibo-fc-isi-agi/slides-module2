<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" font-family="Signika Negative, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="24" fill="#222">
  <!-- phase chevrons -->
  <g font-size="26" font-weight="600">
    <polygon points="20,20 220,20 240,45 220,70 20,70" fill="#2690e7" fill-opacity="0.25" stroke="#2690e7" stroke-width="3"/>
    <text x="125" y="54">Scope</text>
    <polygon points="250,20 450,20 470,45 450,70 250,70 270,45" fill="#bd2b0b" fill-opacity="0.2" stroke="#bd2b0b" stroke-width="3"/>
    <text x="362" y="54">Select</text>
    <polygon points="480,20 920,20 940,45 920,70 480,70 500,45" fill="#e7a626" fill-opacity="0.25" stroke="#e7a626" stroke-width="3"/>
    <text x="712" y="54">Adapt and align model</text>
    <polygon points="950,20 1360,20 1380,45 1360,70 950,70 970,45" fill="#3a9a5b" fill-opacity="0.25" stroke="#3a9a5b" stroke-width="3"/>
    <text x="1168" y="54">Application integration</text>
  </g>

  <!-- Scope -->
  <rect x="20" y="90" width="220" height="350" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
  <text x="130" y="250">Define the</text>
  <text x="130" y="282">use case</text>

  <!-- Select -->
  <rect x="250" y="90" width="220" height="350" rx="12" fill="#bd2b0b" fill-opacity="0.12" stroke="#bd2b0b" stroke-width="3"/>
  <text x="360" y="218">Choose an</text>
  <text x="360" y="250">existing model</text>
  <text x="360" y="282">or pretrain</text>
  <text x="360" y="314">your own</text>

  <!-- Adapt and align -->
  <g fill="#e7a626" fill-opacity="0.15" stroke="#e7a626" stroke-width="3">
    <rect x="480" y="90" width="220" height="106" rx="12"/>
    <rect x="480" y="212" width="220" height="106" rx="12"/>
    <rect x="480" y="334" width="220" height="106" rx="12"/>
    <rect x="710" y="90" width="230" height="350" rx="12"/>
  </g>
  <text x="590" y="137">Prompt</text>
  <text x="590" y="169">engineering</text>
  <text x="590" y="273">Fine-tuning</text>
  <text x="590" y="381">Align with</text>
  <text x="590" y="413">human feedback</text>
  <text x="825" y="273">Evaluate</text>

  <!-- Application integration -->
  <g fill="#3a9a5b" fill-opacity="0.15" stroke="#3a9a5b" stroke-width="3">
    <rect x="950" y="90" width="210" height="350" rx="12"/>
    <rect x="1170" y="90" width="210" height="350" rx="12"/>
  </g>
  <text x="1055" y="218">Optimize and</text>
  <text x="1055" y="250">deploy model</text>
  <text x="1055" y="282">for inference</text>
  <text x="1275" y="202">Augment model</text>
  <text x="1275" y="234">and build</text>
  <text x="1275" y="266">LLM-powered</text>
  <text x="1275" y="298">applications</text>
</svg>
