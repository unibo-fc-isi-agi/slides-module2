<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" font-family="Signika Negative, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="24" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <g stroke="#555" stroke-width="4" marker-end="url(#arrow)">
    <line x1="290" y1="300" x2="370" y2="300"/>
    <line x1="750" y1="300" x2="880" y2="300"/>
    <line x1="1270" y1="300" x2="1440" y2="300"/>
    <line x1="1075" y1="370" x2="1075" y2="420"/>
    <line x1="1075" y1="540" x2="1075" y2="585"/>
  </g>

  <!-- user input -->
  <ellipse cx="160" cy="300" rx="130" ry="80" fill="#bd2b0b" fill-opacity="0.2" stroke="#bd2b0b" stroke-width="3"/>
  <text x="160" y="310" font-size="30" font-weight="600">User input</text>

  <!-- LLM application -->
  <rect x="380" y="160" width="360" height="290" rx="12" fill="#bd2b0b" fill-opacity="0.08" stroke="#bd2b0b" stroke-width="3"/>
  <text x="560" y="205" font-size="30" font-weight="600">LLM application</text>
  <g text-anchor="start">
    <text x="420" y="255">• Pre-processing</text>
    <text x="420" y="295">• Response prompt</text>
    <text x="420" y="335">• Tool calls</text>
    <text x="420" y="375">• Retrieval</text>
    <text x="420" y="415">• …</text>
  </g>

  <!-- judge frame -->
  <rect x="870" y="30" width="410" height="600" rx="12" fill="none" stroke="#bd2b0b" stroke-width="4"/>
  <text x="1075" y="80" font-size="30" font-weight="600">LLM judge</text>
  <ellipse cx="1075" cy="300" rx="170" ry="70" fill="#555" fill-opacity="0.2" stroke="#555" stroke-width="3"/>
  <text x="1075" y="310" font-size="30" font-weight="600">LLM response</text>
  <rect x="960" y="430" width="230" height="105" rx="12" fill="#bd2b0b" fill-opacity="0.12" stroke="#bd2b0b" stroke-width="3"/>
  <text x="1075" y="470">Is it polite:</text>
  <text x="1075" y="505">yes or no?</text>
  <text x="1075" y="615" font-size="28">…</text>
  <text x="1470" y="290" font-size="28">…</text>
</svg>
