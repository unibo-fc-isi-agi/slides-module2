<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" font-family="Signika Negative, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#222">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<!-- user -->
<rect x="20" y="300" width="200" height="150" rx="12" fill="#555" fill-opacity="0.15" stroke="#555" stroke-width="3"/>
<text x="120" y="355" font-size="26" font-weight="600">User</text>
<text x="120" y="390" font-size="20">e.g. the committee:</text>
<text x="120" y="415" font-size="20">goals, questions</text>
<line x1="220" y1="375" x2="300" y2="190" stroke="#555" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<!-- agent -->
<rect x="260" y="20" width="760" height="740" rx="16" fill="#3a9a5b" fill-opacity="0.06" stroke="#3a9a5b" stroke-width="3" stroke-dasharray="12,6"/>
<text x="640" y="58" font-size="30" font-weight="600" fill="#3a9a5b">Agent</text>
<rect x="300" y="80" width="680" height="170" rx="12" fill="#3a9a5b" fill-opacity="0.15" stroke="#3a9a5b" stroke-width="3"/>
<text x="640" y="120" font-size="26" font-weight="600">Controller (your code)</text>
<text x="640" y="160" font-size="21">the loop: perceive → deliberate → act → observe</text>
<text x="640" y="190" font-size="21">builds the context, executes tool calls,</text>
<text x="640" y="220" font-size="21">decides when to stop</text>
<rect x="300" y="300" width="320" height="200" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
<text x="460" y="340" font-size="26" font-weight="600">LLM</text>
<text x="460" y="375" font-size="21" font-style="italic">deliberation</text>
<text x="460" y="410" font-size="20">interprets the context,</text>
<text x="460" y="438" font-size="20">proposes the next action</text>
<text x="460" y="466" font-size="20">(tool call or answer)</text>
<rect x="660" y="300" width="320" height="200" rx="12" fill="#555" fill-opacity="0.10" stroke="#555" stroke-width="3"/>
<text x="820" y="340" font-size="26" font-weight="600">Memory</text>
<text x="820" y="380" font-size="20">conversation history,</text>
<text x="820" y="408" font-size="20">tool results, task state</text>
<text x="820" y="436" font-size="20">(more in the RAG lecture)</text>
<rect x="300" y="550" width="680" height="180" rx="12" fill="#d64545" fill-opacity="0.10" stroke="#d64545" stroke-width="3"/>
<text x="640" y="592" font-size="26" font-weight="600">Policies</text>
<text x="640" y="630" font-size="20">which tools, with which permissions? how many steps?</text>
<text x="640" y="660" font-size="20">which actions need human approval?</text>
<text x="640" y="690" font-size="20">what gets logged?</text>
<line x1="460" y1="250" x2="460" y2="300" stroke="#555" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="820" y1="250" x2="820" y2="300" stroke="#555" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<!-- tools -->
<text x="1200" y="58" font-size="30" font-weight="600" fill="#e7a626">Tools</text>
<rect x="1080" y="80" width="240" height="190" rx="12" fill="#e7a626" fill-opacity="0.15" stroke="#e7a626" stroke-width="3"/>
<text x="1200" y="118" font-size="24" font-weight="600">Perception</text>
<text x="1200" y="152" font-size="18">get information</text>
<text x="1200" y="190" font-size="18" font-family="Menlo, Consolas, monospace">list_candidates</text>
<text x="1200" y="218" font-size="18" font-family="Menlo, Consolas, monospace">read_letter</text>
<text x="1200" y="246" font-size="18">search, DB queries</text>
<rect x="1080" y="300" width="240" height="190" rx="12" fill="#e7a626" fill-opacity="0.15" stroke="#e7a626" stroke-width="3"/>
<text x="1200" y="338" font-size="24" font-weight="600">Reasoning</text>
<text x="1200" y="372" font-size="18">compute, check, verify</text>
<text x="1200" y="410" font-size="18" font-family="Menlo, Consolas, monospace">score_letter</text>
<text x="1200" y="438" font-size="18">calculators, solvers,</text>
<text x="1200" y="466" font-size="18">validators, planners</text>
<rect x="1080" y="520" width="240" height="190" rx="12" fill="#e7a626" fill-opacity="0.15" stroke="#e7a626" stroke-width="3"/>
<text x="1200" y="558" font-size="24" font-weight="600">Actuation</text>
<text x="1200" y="592" font-size="18">change the world</text>
<text x="1200" y="630" font-size="18" font-family="Menlo, Consolas, monospace">record_decision</text>
<text x="1200" y="658" font-size="18">send e-mails,</text>
<text x="1200" y="686" font-size="18">update records</text>
<line x1="980" y1="165" x2="1080" y2="175" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<line x1="980" y1="200" x2="1080" y2="395" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<line x1="980" y1="230" x2="1080" y2="615" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<!-- environment -->
<rect x="1380" y="80" width="200" height="630" rx="12" fill="#7e57c2" fill-opacity="0.15" stroke="#7e57c2" stroke-width="3"/>
<text x="1480" y="125" font-size="26" font-weight="600">Environment</text>
<text x="1480" y="200" font-size="20">files</text>
<text x="1480" y="235" font-size="20">(letters, passports,</text>
<text x="1480" y="262" font-size="20">transcripts)</text>
<text x="1480" y="330" font-size="20">databases</text>
<text x="1480" y="390" font-size="20">Web APIs</text>
<text x="1480" y="450" font-size="20">other software</text>
<text x="1480" y="510" font-size="20">other people</text>
<text x="1480" y="570" font-size="20">rules, roles,</text>
<text x="1480" y="597" font-size="20">deadlines</text>
<line x1="1380" y1="175" x2="1320" y2="175" stroke="#7e57c2" stroke-width="3" marker-end="url(#a)"/>
<line x1="1320" y1="615" x2="1380" y2="615" stroke="#7e57c2" stroke-width="3" marker-end="url(#a)"/>
</svg>
