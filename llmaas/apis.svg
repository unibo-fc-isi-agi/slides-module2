<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Signika Negative, Helvetica, Arial, sans-serif" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="960" y="52" font-size="40" text-anchor="middle" font-weight="700" xml:space="preserve">The Landscape of OpenAI APIs</text>
  <text x="960" y="92" font-size="24" text-anchor="middle" fill="#555" xml:space="preserve">Different APIs for different needs</text>
  <rect x="40" y="120" width="905" height="410" rx="12" fill="#2690e7" fill-opacity="0.07" stroke="#2690e7" stroke-width="3"/>
  <circle cx="85" cy="168" r="24" fill="#2690e7"/>
  <text x="85" y="176.4" font-size="24" text-anchor="middle" font-weight="700" fill="#fff" xml:space="preserve">1</text>
  <text x="125" y="178" font-size="32" text-anchor="start" font-weight="700" fill="#2690e7" xml:space="preserve">Chat Completions API</text>
  <text x="125" y="210" font-size="22" text-anchor="start" xml:space="preserve">The simple messaging API</text>
  <rect x="70" y="230" width="290" height="44" rx="10" fill="#2690e7" fill-opacity="0.12" stroke="#2690e7" stroke-width="2"/>
  <text x="215.0" y="258.3" font-size="18" text-anchor="middle" xml:space="preserve">User: “How do I fix a flat tire?”</text>
  <line x1="368" y1="252" x2="404" y2="252" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="412" y="230" width="310" height="44" rx="10" fill="#2690e7" fill-opacity="0.12" stroke="#2690e7" stroke-width="2"/>
  <text x="567.0" y="258.3" font-size="18" text-anchor="middle" xml:space="preserve">Assistant: “Here’s how you can…”</text>
  <text x="740" y="259" font-size="18" text-anchor="start" font-style="italic" xml:space="preserve">simple request</text>
  <text x="740" y="282" font-size="18" text-anchor="start" font-style="italic" xml:space="preserve">→ text response</text>
  <text x="70" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#2690e7" xml:space="preserve">Best for</text>
  <text x="510" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#2690e7" xml:space="preserve">Key features</text>
  <text x="70" y="357" font-size="20" text-anchor="start" xml:space="preserve">• Simple text generation</text>
  <text x="70" y="385" font-size="20" text-anchor="start" xml:space="preserve">• Q&amp;A</text>
  <text x="70" y="413" font-size="20" text-anchor="start" xml:space="preserve">• Chatbots</text>
  <text x="70" y="441" font-size="20" text-anchor="start" xml:space="preserve">• Industry standard</text>
  <text x="510" y="357" font-size="20" text-anchor="start" xml:space="preserve">• Messages in, text out</text>
  <text x="510" y="385" font-size="20" text-anchor="start" xml:space="preserve">• Function calling</text>
  <text x="510" y="413" font-size="20" text-anchor="start" xml:space="preserve">• Streaming</text>
  <rect x="60" y="468" width="865" height="44" rx="22" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="0"/>
  <rect x="60" y="468" width="150" height="44" rx="22" fill="#2690e7" fill-opacity="1" stroke="#2690e7" stroke-width="0"/>
  <text x="135" y="497" font-size="20" text-anchor="middle" font-weight="700" fill="#fff" xml:space="preserve">When to use</text>
  <text x="230" y="497" font-size="20" text-anchor="start" font-weight="600" xml:space="preserve">Most common use case: simple, fast, reliable.</text>
