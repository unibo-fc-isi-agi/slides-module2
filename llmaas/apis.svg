  <text x="1060" y="210" font-size="22" text-anchor="start" xml:space="preserve">The newer API, with memory &amp; tools</text>
  <rect x="1770" y="142" width="85" height="36" rx="18" fill="#3a9a5b" fill-opacity="1" stroke="#3a9a5b" stroke-width="0"/>
  <text x="1813" y="167" font-size="20" text-anchor="middle" font-weight="700" fill="#fff" xml:space="preserve">NEW</text>
