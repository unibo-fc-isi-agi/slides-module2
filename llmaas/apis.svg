  <text x="1005" y="357" font-size="20" text-anchor="start" xml:space="preserve">• New projects</text>
  <text x="1005" y="385" font-size="20" text-anchor="start" xml:space="preserve">• Complex workflows</text>
  <text x="1005" y="413" font-size="20" text-anchor="start" xml:space="preserve">• Built-in tools</text>
  <text x="1005" y="441" font-size="20" text-anchor="start" xml:space="preserve">• Context understanding</text>
  <text x="1445" y="357" font-size="20" text-anchor="start" xml:space="preserve">• Conversation state (API-side)</text>
  <text x="1445" y="385" font-size="20" text-anchor="start" xml:space="preserve">• Built-in tools</text>
  <text x="1445" y="413" font-size="20" text-anchor="start" xml:space="preserve">• Rich multimodal I/O</text>
  <rect x="995" y="468" width="865" height="44" rx="22" fill="#3a9a5b" fill-opacity="0.15" stroke="#3a9a5b" stroke-width="0"/>
