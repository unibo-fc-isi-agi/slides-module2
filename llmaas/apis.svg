  <text x="1052.5" y="258.65" font-size="19" text-anchor="middle" xml:space="preserve">Search</text>
  <rect x="1115" y="230" width="95" height="44" rx="10" fill="#3a9a5b" fill-opacity="0.12" stroke="#3a9a5b" stroke-width="2"/>
