  <text x="1070" y="497" font-size="20" text-anchor="middle" font-weight="700" fill="#fff" xml:space="preserve">When to use</text>
  <text x="1165" y="497" font-size="20" text-anchor="start" font-weight="600" xml:space="preserve">When you need memory, tools, complex workflows.</text>
  <rect x="40" y="548" width="905" height="410" rx="12" fill="#e7a626" fill-opacity="0.07" stroke="#e7a626" stroke-width="3"/>
  <circle cx="85" cy="596" r="24" fill="#e7a626"/>
