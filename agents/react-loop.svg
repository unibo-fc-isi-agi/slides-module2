<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="Signika Negative, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#222">
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2690e7"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e7a626"/></marker></defs>
<!-- lifelines -->
<g stroke="#999" stroke-width="2" stroke-dasharray="4,6"><line x1="130" y1="130" x2="130" y2="1060"/><line x1="560" y1="130" x2="560" y2="1060"/><line x1="1000" y1="130" x2="1000" y2="1060"/><line x1="1420" y1="130" x2="1420" y2="1060"/></g>
<rect x="30" y="20" width="200" height="110" rx="12" fill="#555" fill-opacity="0.15" stroke="#555" stroke-width="3"/>
<text x="130" y="68" font-size="26" font-weight="600">User</text><text x="130" y="100" font-size="18">e.g. via CLI chat</text>
<rect x="410" y="20" width="300" height="110" rx="12" fill="#3a9a5b" fill-opacity="0.15" stroke="#3a9a5b" stroke-width="3"/>
<text x="560" y="68" font-size="26" font-weight="600">Agent</text><text x="560" y="100" font-size="18">controller: your code</text>
<rect x="850" y="20" width="300" height="110" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
<text x="1000" y="68" font-size="26" font-weight="600">LLM</text><text x="1000" y="100" font-size="18">via Chat Completion API</text>
<rect x="1270" y="20" width="300" height="110" rx="12" fill="#e7a626" fill-opacity="0.15" stroke="#e7a626" stroke-width="3"/>
<text x="1420" y="68" font-size="26" font-weight="600">Tools</text><text x="1420" y="100" font-size="18">Python functions</text>
<!-- 1 -->
<line x1="130" y1="185" x2="554" y2="185" stroke="#555" stroke-width="3" marker-end="url(#k)"/>
<text x="345" y="172" font-size="19" font-weight="600" fill="#555">1 · “Where was Turing born? Time, weather there?”</text>
<!-- loop frame -->
<rect x="400" y="215" width="1170" height="700" rx="8" fill="none" stroke="#3a9a5b" stroke-width="3" stroke-dasharray="10,6"/>
<rect x="400" y="215" width="530" height="36" fill="#3a9a5b" fill-opacity="0.15"/>
<text x="665" y="241" font-size="21" font-weight="600" fill="#3a9a5b">ReAct loop: until no tool calls (or max steps)</text>
<!-- 2 -->
<line x1="560" y1="300" x2="994" y2="300" stroke="#2690e7" stroke-width="3" marker-end="url(#b)"/>
<text x="780" y="287" font-size="21" font-weight="600" fill="#2690e7">2 · system + question + tool definitions</text>
<!-- 3 -->
<line x1="1000" y1="360" x2="566" y2="360" stroke="#2690e7" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#b)"/>
<text x="780" y="347" font-size="21" font-weight="600" fill="#2690e7">3 · tool call: web_search(...)</text>
<!-- 4/5 -->
<line x1="560" y1="420" x2="1414" y2="420" stroke="#e7a626" stroke-width="3" marker-end="url(#o)"/>
<text x="1200" y="407" font-size="21" font-weight="600" fill="#e7a626">4 · web_search("Alan Turing birthplace")</text>
<line x1="1420" y1="475" x2="566" y2="475" stroke="#e7a626" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#o)"/>
<rect x="890" y="443" width="620" height="26" fill="#fff"/>
<text x="1200" y="462" font-size="19" font-family="Menlo, Consolas, monospace">5 · [{title: "Alan Turing - Wikipedia", ...}]</text>
<!-- 6/7 -->
<line x1="560" y1="540" x2="994" y2="540" stroke="#2690e7" stroke-width="3" marker-end="url(#b)"/>
<text x="780" y="527" font-size="21" font-weight="600" fill="#2690e7">6 · ... + tool result</text>
<line x1="1000" y1="610" x2="566" y2="610" stroke="#2690e7" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#b)"/>
<text x="780" y="584" font-size="21" font-weight="600" fill="#2690e7">7 · 2 tool calls, in parallel:</text>
<rect x="595" y="588" width="370" height="22" fill="#fff"/>
<text x="780" y="604" font-size="17" font-family="Menlo, Consolas, monospace">get_current_time, get_weather</text>
<!-- 8/9 -->
<line x1="560" y1="670" x2="1414" y2="670" stroke="#e7a626" stroke-width="3" marker-end="url(#o)"/>
<text x="1200" y="657" font-size="21" font-weight="600" fill="#e7a626">8 · get_current_time("Europe/London")</text>
<text x="1200" y="707" font-size="21" font-weight="600" fill="#e7a626">get_weather("London")</text>
<line x1="1420" y1="745" x2="566" y2="745" stroke="#e7a626" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#o)"/>
<rect x="880" y="713" width="640" height="26" fill="#fff"/>
<text x="1200" y="732" font-size="19" font-family="Menlo, Consolas, monospace">9 · "Tuesday 16:59+0100", {temp: 20.5, ...}</text>
<!-- 10/11 -->
<line x1="560" y1="805" x2="994" y2="805" stroke="#2690e7" stroke-width="3" marker-end="url(#b)"/>
<text x="780" y="792" font-size="21" font-weight="600" fill="#2690e7">10 · ... + tool results</text>
<line x1="1000" y1="875" x2="566" y2="875" stroke="#2690e7" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#b)"/>
<text x="780" y="850" font-size="21" font-weight="600" fill="#2690e7">11 · no tool calls: final answer</text>
<!-- 12 -->
<line x1="560" y1="975" x2="136" y2="975" stroke="#555" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#k)"/>
<text x="345" y="962" font-size="21" font-weight="600" fill="#555">12 · “London: 16:59, 20.5 °C”</text>
<rect x="510" y="1018" width="540" height="30" fill="#fff"/>
<text x="780" y="1040" font-size="20" font-style="italic" fill="#555">the LLM never runs tools: it only asks the agent to</text>
</svg>
