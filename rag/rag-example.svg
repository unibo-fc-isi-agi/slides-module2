<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" font-family="Signika Negative, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#222">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<!-- lane: indexing -->
<rect x="10" y="10" width="1780" height="230" rx="16" fill="#555" fill-opacity="0.04" stroke="#555" stroke-width="2" stroke-dasharray="10,6"/>
<text x="30" y="44" font-size="24" font-weight="600" text-anchor="start" fill="#555">1. Indexing (offline, once)</text>
<rect x="40" y="70" width="330" height="150" rx="12" fill="#555" fill-opacity="0.10" stroke="#555" stroke-width="3"/>
<text x="205" y="108" font-size="24" font-weight="600">Documents</text>
<text x="205" y="145" font-size="20">3 recommendation letters</text>
<text x="205" y="175" font-size="20">+ regulations of the</text>
<text x="205" y="202" font-size="20">PhD programme</text>
<line x1="370" y1="145" x2="440" y2="145" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="445" y="70" width="330" height="150" rx="12" fill="#555" fill-opacity="0.10" stroke="#555" stroke-width="3"/>
<text x="610" y="108" font-size="24" font-weight="600">Chunks</text>
<text x="610" y="145" font-size="20">44 = paragraphs of letters</text>
<text x="610" y="175" font-size="20">+ articles of regulations</text>
<text x="610" y="202" font-size="18" fill="#555">(text + metadata)</text>
<line x1="775" y1="145" x2="845" y2="145" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="850" y="70" width="330" height="150" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
<text x="1015" y="108" font-size="24" font-weight="600">Embedding model</text>
<text x="1015" y="150" font-size="20">one vector per chunk</text>
<text x="1015" y="180" font-size="20">(768 numbers each)</text>
<line x1="1180" y1="145" x2="1250" y2="145" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="1255" y="70" width="500" height="150" rx="12" fill="#3a9a5b" fill-opacity="0.15" stroke="#3a9a5b" stroke-width="3"/>
<text x="1505" y="108" font-size="24" font-weight="600">Vector store (SQLite)</text>
<text x="1505" y="150" font-size="20">id · text · metadata · embedding</text>
<text x="1505" y="180" font-size="20">e.g. regulations-phd#art5, ...</text>
<!-- lane: query -->
<rect x="10" y="270" width="1780" height="480" rx="16" fill="#2690e7" fill-opacity="0.03" stroke="#555" stroke-width="2" stroke-dasharray="10,6"/>
<text x="30" y="304" font-size="24" font-weight="600" text-anchor="start" fill="#555">2. Retrieval and 3. generation (online, per question)</text>
<rect x="40" y="330" width="330" height="180" rx="12" fill="#555" fill-opacity="0.10" stroke="#555" stroke-width="3"/>
<text x="205" y="368" font-size="24" font-weight="600">Committee</text>
<text x="205" y="410" font-size="20" font-style="italic">"Which English</text>
<text x="205" y="438" font-size="20" font-style="italic">certificate does a</text>
<text x="205" y="466" font-size="20" font-style="italic">candidate need?"</text>
<line x1="370" y1="420" x2="845" y2="420" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<text x="610" y="408" font-size="19" fill="#555">question</text>
<rect x="850" y="330" width="330" height="180" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
<text x="1015" y="368" font-size="24" font-weight="600">Embedding model</text>
<text x="1015" y="410" font-size="20">same model as</text>
<text x="1015" y="438" font-size="20">for the chunks</text>
<line x1="1180" y1="420" x2="1250" y2="420" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<text x="1215" y="400" font-size="17" fill="#555">vector</text>
<rect x="1255" y="330" width="500" height="180" rx="12" fill="#3a9a5b" fill-opacity="0.15" stroke="#3a9a5b" stroke-width="3"/>
<text x="1505" y="368" font-size="24" font-weight="600">KNN search: top-3 chunks</text>
<text x="1505" y="408" font-size="20" text-anchor="middle">1. Art. 5 – Language requirements</text>
<text x="1505" y="438" font-size="20" fill="#555">2. Art. 3 – Admission requirements</text>
<text x="1505" y="468" font-size="20" fill="#555">3. Art. 4 – How to apply</text>
<line x1="1505" y1="220" x2="1505" y2="325" stroke="#3a9a5b" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#a)"/>
<line x1="1505" y1="510" x2="1505" y2="560" stroke="#555" stroke-width="3"/>
<line x1="1505" y1="560" x2="1185" y2="560" stroke="#555" stroke-width="3"/>
<line x1="1185" y1="560" x2="1185" y2="585" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<text x="1350" y="550" font-size="19" fill="#555">retrieved chunks</text>
<!-- prompt, llm, answer -->
<rect x="850" y="590" width="440" height="140" rx="12" fill="#555" fill-opacity="0.10" stroke="#555" stroke-width="3"/>
<text x="1070" y="628" font-size="24" font-weight="600">Augmented prompt</text>
<text x="1070" y="665" font-size="20">instructions + 3 chunks (as data,</text>
<text x="1070" y="693" font-size="20">with their IDs) + the question</text>
<line x1="850" y1="660" x2="790" y2="660" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="560" y="590" width="225" height="140" rx="12" fill="#2690e7" fill-opacity="0.15" stroke="#2690e7" stroke-width="3"/>
<text x="672" y="650" font-size="26" font-weight="600">LLM</text>
<text x="672" y="685" font-size="19" font-style="italic">generation</text>
<line x1="560" y1="660" x2="500" y2="660" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="40" y="560" width="455" height="170" rx="12" fill="#3a9a5b" fill-opacity="0.08" stroke="#3a9a5b" stroke-width="3"/>
<text x="267" y="598" font-size="24" font-weight="600">Answer, with citation</text>
<text x="267" y="638" font-size="20" font-style="italic">"IELTS Academic ≥ 6.0, TOEFL iBT</text>
<text x="267" y="666" font-size="20" font-style="italic">≥ 80, or Cambridge B2 First"</text>
<text x="267" y="706" font-size="20" font-weight="600" fill="#3a9a5b">source: regulations-phd#art5</text>
<line x1="205" y1="510" x2="205" y2="555" stroke="#555" stroke-width="3" marker-start="url(#a)"/>
</svg>
